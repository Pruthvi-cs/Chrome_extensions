<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal Ad Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Ad Blocker</h1>
    <div class="counter">
      <strong id="blocked-count">0</strong>
      <span>ads blocked on this page</span>
    </div>
    <label class="setting" for="enabled">
      <span>Protection</span>
      <input id="enabled" type="checkbox">
    </label>
  </main>
  <script src="popup.js"></script>
</body>
</html>
