<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Natural CSS Editor Settings</title>
  <style>
    body { max-width: 620px; margin: 40px auto; padding: 0 20px; font: 14px system-ui, sans-serif; color: #172033; }
    label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 18px; border: 0; border-radius: 8px; padding: 10px 14px; background: #2563eb; color: white; font-weight: 700; }
  </style>
</head>
<body>
  <h1>LLM connection</h1>
  <p>Use an OpenAI-compatible chat completions endpoint. The API key is stored in Chrome extension storage.</p>
  <label for="endpoint">Endpoint</label>
  <input id="endpoint" value="https://api.openai.com/v1/chat/completions">
  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" autocomplete="off">
  <label for="model">Model</label>
  <input id="model" value="gpt-4o-mini">
  <button id="save">Save</button>
  <p id="saved" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
