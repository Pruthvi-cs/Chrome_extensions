<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetTrace Visual Settings</title>
  <style>
    body { max-width:680px; margin:40px auto; padding:0 20px; font:14px system-ui,sans-serif; color:#172033; }
    label { display:block; margin:18px 0 6px; font-weight:700; }
    input { box-sizing:border-box; width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; }
    button { margin-top:18px; border:0; border-radius:8px; padding:10px 14px; background:#2563eb; color:white; font-weight:700; }
  </style>
</head>
<body>
  <h1>NetTrace Visual settings</h1>
  <label for="traceEndpoint">Backend traceroute endpoint (optional)</label>
  <input id="traceEndpoint" placeholder="https://api.example.com/traceroute">
  <button id="save">Save</button>
  <p id="saved" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
