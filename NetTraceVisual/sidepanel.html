<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetTrace Visual</title>
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">ACTIVE ROUTE</p>
        <h1 id="domain">Loading...</h1>
      </div>
      <button id="traceButton" class="primary" type="button">Trace Route</button>
    </header>

    <section class="status-grid">
      <article>
        <span>Destination IP</span>
        <strong id="destinationIp">--</strong>
      </article>
      <article>
        <span>Third parties</span>
        <strong id="thirdPartyCount">0</strong>
      </article>
      <article>
        <span>Redirects</span>
        <strong id="redirectCount">0</strong>
      </article>
    </section>

    <section id="map" class="map" aria-label="Route map"></section>

    <section class="panel">
      <div class="panel-heading">
        <h2>Hop latency</h2>
        <span id="traceStatus">Ready</span>
      </div>
      <div id="latencyList" class="latency-list">
        <p class="empty">Run a trace to inspect network hops.</p>
      </div>
    </section>

    <section class="panel diagnosis">
      <div class="panel-heading">
        <h2>Route diagnosis</h2>
        <button id="diagnoseButton" type="button" disabled>Diagnose Route</button>
      </div>
      <div id="diagnosis" class="diagnosis-content">
        Trace a route to generate an AI diagnosis.
      </div>
    </section>
  </main>

  <script src="leaflet.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
